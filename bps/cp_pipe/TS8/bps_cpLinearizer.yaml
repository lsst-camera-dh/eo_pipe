includeConfigs:
  - ${PWD}/bps/bps_butler_config.yaml
  - ${PWD}/bps/cp_pipe/TS8/bps_qgraph_options.yaml

pipelineYaml: "${EO_PIPE_DIR}/pipelines/cp_pipe/TS8/cpLinearizer.yaml"
instrument: ${INSTRUMENT_CLASS}

payload:
  dataset_selection: ${DATASET_SELECTION}
  dataset_label: ${DATASET_LABEL}
  weekly: ${WEEKLY}
  payload_modifier: ${PAYLOAD_MODIFIER}
  inCollection: u/{operator}/ptc{payload_modifier}_{dataset_label}_{weekly}
  payloadName: linearizer{payload_modifier}_{dataset_label}_{weekly}
  butlerConfig: ${BUTLER_CONFIG}
  dataQuery: "instrument='${INSTRUMENT_NAME}' and {dataset_selection} and exposure.observation_type='flat' and exposure.observation_reason='flat' ${DETECTOR_SELECTION}"
