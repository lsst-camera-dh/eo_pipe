includeConfigs:
  - ${PWD}/bps/bps_butler_config.yaml
  - ${PWD}/bps/cp_pipe/TS8/bps_qgraph_options.yaml

isrTaskName: cpPtcIsr
extraQgraphOptions: "{isr_QgraphOptions} --config {isrTaskName}:doDeferredCharge=False --config {isrTaskName}:doLinearize=False --config cpPtcSolve:ptcFitType='EXPAPPROXIMATION' --config cpPtcSolve:maxSignalInitialPtcOutlierFit=50000"

pipelineYaml: "${EO_PIPE_DIR}/pipelines/cp_pipe/TS8/cpPtc.yaml"
instrument: ${INSTRUMENT_CLASS}

payload:
  dataset_selection: ${DATASET_SELECTION}
  dataset_label: ${DATASET_LABEL}
  weekly: ${WEEKLY}
  inCollection: LSST-TS8/defaults
  output: u/${USER}/{dataset_label}_{weekly}
  butlerConfig: ${BUTLER_CONFIG}
  dataQuery: "instrument='${INSTRUMENT_NAME}' and {dataset_selection} and exposure.observation_type='flat' and exposure.observation_reason='flat' ${DETECTOR_SELECTION}"
