includeConfigs:
  - ${PWD}/bps/bps_butler_config.yaml
  - ${PWD}/bps/cp_pipe/TS8/bps_qgraph_options.yaml

isrTaskName: cpPtcIsr

extraQgraphOptions: "{isr_QgraphOptions} --config {isrTaskName}:doLinearize=False --config cpPtcIsr:doDeferredCharge=False --config cpPtcExtractPair:matchExposuresType='TIME' --config cpPtcExtractPair:doExtractPhotodiodeData=True --config cpPtcExtractPair:useEfdPhotodiodeData=False --config cpPtcSolve:ptcFitType='EXPAPPROXIMATION' --config cpPtcSolve:maxSignalInitialPtcOutlierFit=50000"

pipelineYaml: "${CP_PIPE_DIR}/pipelines/${INSTRUMENT_NAME}/cpPtc.yaml"
instrument: ${INSTRUMENT_CLASS}

payload:
  dataset_selection: ${DATASET_SELECTION}
  dataset_label: ${DATASET_LABEL}
  weekly: ${WEEKLY}
  payload_modifier: ${PAYLOAD_MODIFIER}
  inCollection: u/{operator}/defects{payload_modifier}_{dataset_label}_{weekly},${INSTRUMENT_NAME}/photodiode
  payloadName: ptc{payload_modifier}_{dataset_label}_{weekly}
  butlerConfig: ${BUTLER_CONFIG}
  dataQuery: "instrument='${INSTRUMENT_NAME}' and {dataset_selection} and exposure.observation_type='flat' and exposure.observation_reason='flat' ${DETECTOR_SELECTION}"
