includeConfigs:
  - ${PWD}/bps/bps_butler_config.yaml
  - ${PWD}/bps/cp_pipe/TS8/bps_qgraph_options.yaml

isrTaskName: cpFlatIsr
extraQgraphOptions: "{isr_QgraphOptions} --config {isrTaskName}:doBrighterFatter=False --config {isrTaskName}:doDefect=False --config {isrTaskName}:doLinearize=False --config cpFlatCombine:exposureScaling='Unity'"

pipelineYaml: "${CP_PIPE_DIR}/pipelines/${INSTRUMENT_NAME}/cpFlat.yaml#cpFlatIsr,cpFlatMeasure,cpFlatNormalize,cpFlatCombine"
instrument: ${INSTRUMENT_CLASS}

payload:
  dataset_selection: ${DATASET_SELECTION}
  dataset_label: ${DATASET_LABEL}
  weekly: ${WEEKLY}
  inCollection: LSST-TS8/defaults
  output: u/${USER}/{dataset_label}_{weekly}
  butlerConfig: ${BUTLER_CONFIG}
  dataQuery: "instrument='${INSTRUMENT_NAME}' and {dataset_selection} and exposure.observation_type='flat' and exposure.observation_reason in ('gain_stability', 'sflat', 'sflat_hi') ${DETECTOR_SELECTION}"
