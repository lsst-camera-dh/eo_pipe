    - INSTRUMENT_CLASS
    - INSTRUMENT_NAME
    - ACQ_RUN
    - DATASET_SELECTION
    - DATASET_LABEL
    - DETECTOR_SELECTION
    - DO_PARALLEL_OSCAN

b_protocol:
  pipelines:
    - TS8/bps_eoReadNoise.yaml
    - TS8/bps_eoRaftAmpCorrelations.yaml
    - TS8/bps_eoBrightDefects.yaml
    - TS8/bps_eoDarkDefects.yaml
